<template>
    <lightning-card>
        <h1 slot="title" class="slds-text-heading_medium">Umbrales de alerta</h1>
        <div slot="actions">
            <lightning-button
                label="Actualizar"
                onclick={handleRefresh}
                disabled={isLoading}
            ></lightning-button>
        </div>
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <p class="slds-m-bottom_small">
                Cada fila dice desde qué valor una lectura pasa a Advertencia y a Crítico. Si la medición
                empeora al bajar, como la presión, el crítico tiene que ser menor que la advertencia. Si
                empeora al subir, tiene que ser mayor. Un cambio aplica a las señales que lleguen después;
                las que ya se procesaron no cambian.
            </p>

            <template lwc:if={isReadOnly}>
                <p role="status" class="slds-m-bottom_small">Puedes consultar los umbrales, pero no cambiarlos.</p>
            </template>

            <template lwc:if={isLoading}>
                <div role="status" class="slds-is-relative spinner-holder">
                    <lightning-spinner alternative-text="Consultando los umbrales…" size="small"></lightning-spinner>
                </div>
                <p class="slds-align_absolute-center">Consultando los umbrales…</p>
            </template>

            <template lwc:if={isEmpty}>
                <p role="status">No hay umbrales configurados.</p>
            </template>

            <template lwc:if={isError}>
                <div role="alert">
                    <p class="slds-m-bottom_small">{errorMessage}</p>
                    <lightning-button label="Reintentar" onclick={handleRefresh}></lightning-button>
                </div>
            </template>

            <template lwc:if={isData}>
                <lightning-datatable
                    key-field="id"
                    data={rows}
                    columns={columns}
                    draft-values={draftValues}
                    errors={errors}
                    onsave={handleSave}
                    oncancel={handleCancel}
                    is-loading={isSaving}
                    suppress-bottom-bar={isReadOnly}
                    hide-checkbox-column
                ></lightning-datatable>
            </template>
        </div>
    </lightning-card>
</template>
